# Everything the scorer reads. The verification protocol explains each choice in words.
# Values marked TODO are fixed at the stop points in CLAUDE.md, not before.

region:
  name: Singapore and surroundings
  bounding_box: {south: 0.5, north: 2.5, west: 102.5, east: 105.0}
  local_timezone: Asia/Singapore

period:
  # Valid times, UTC. Fixed 2026-11-10 (option A in docs/source_check.md).
  day_level_lead_times: {start: 2024-02-11, end: 2026-10-31}   # Previous Runs: GFS and IFS 0.25 complete from here at lead day 7
  hour_level_lead_times: {start: 2026-04-02, end: 2026-10-31}  # Single Runs: first run for GFS and IFS 0.25
  climatology_years: {start: 2017-01-01, end: 2023-12-31}      # station data before the test period, no overlap

variables:
  - rain_hourly
  - temperature_2m
  - wind_speed_10m

# Values marked "proposed" were accepted on 2026-11-13 (docs/verification_protocol.md).
# The scorer refuses to run while proposals_accepted is false.
proposals_accepted: true    # signed off 2026-11-13, protocol change log

rain_thresholds_mm_per_hour: [0.1, 1.0, 10.0]   # proposed, protocol section 4

lead_times:
  days: [1, 2, 3, 5, 7]
  hours: {max: 168, table_bin: 6}               # proposed, protocol 6.1
  single_run_hours_utc: [0, 12]                 # proposed, protocol 3.5

matching:                                       # proposed, protocol section 3
  cell_rule: nearest                            # the cell the station sits in; main table
  cell_rule_sensitivity: land                   # Open-Meteo's land preference, sensitivity check only
  gauge_stamp: end                              # a 5-minute stamp marks the end of its interval
  rain_readings_per_hour: 12                    # keep an hour only when complete
  instant_window_minutes: 0                     # temperature and wind: the reading stamped on the hour
  knots_to_ms: 0.514444

baselines:                                      # proposed, protocol section 5
  persistence_day_offset_hours: 24              # lead day N uses the observation 24N hours earlier
  climatology_min_years: 3                      # fewer years of history: network climatology
  climatology_event_probability_cut: 0.5        # climatology says "yes" to an event at this frequency

regimes:                                        # proposed, protocol 6.3, fixed calendar dates (month-day)
  northeast_monsoon: {start: "12-01", end: "03-15"}
  inter_monsoon_1: {start: "03-16", end: "05-31"}
  southwest_monsoon: {start: "06-01", end: "09-30"}
  inter_monsoon_2: {start: "10-01", end: "11-30"}

forecast_sources:
  - persistence
  - climatology
  - gfs_global       # identifiers confirmed against the API, 2026-11-10
  - ecmwf_ifs025

# Scored separately on the part of the period they cover, never pooled with the main table.
secondary_forecast_sources:
  - {id: ecmwf_aifs025_single, from: 2025-02-24}
  - {id: ecmwf_ifs, from: 2025-10-07}

bootstrap:
  unit: day                                     # proposed, protocol section 7: daily series
  block_length_days: 8                          # fixed 2026-11-13 from baseline errors, scripts/fix_block_length.py
  resamples: 2000
  alpha: 0.05
  seed: 0

quality_control:
  score_with_and_without_flags: true
  # Starting values for the checks, to be reviewed in the observation notes. Units as stored.
  range:
    rainfall_mm_per_5min: {min: 0, max: 30}
    air_temperature_c: {min: 18, max: 40}
    relative_humidity_pct: {min: 20, max: 100}
    wind_speed_knots: {min: 0, max: 60}
    isd_temperature_c: {min: 15, max: 40}
    isd_wind_speed_ms: {min: 0, max: 40}
  spike:                       # jump from both neighbours, same sign, within max_gap_minutes
    air_temperature_c: {jump: 3.0, max_gap_minutes: 5}
    relative_humidity_pct: {jump: 15.0, max_gap_minutes: 5}
    isd_temperature_c: {jump: 4.0, max_gap_minutes: 90}
  flatline:                    # identical value for at least this long
    air_temperature_c: {minutes: 120}
    relative_humidity_pct: {minutes: 240}
    wind_speed_knots: {minutes: 360, ignore_value: 0}
    rainfall_mm_per_5min: {minutes: 60, ignore_value: 0}
  stuck_dry:                   # gauge reads zero for an hour while nearby gauges read a lot
    radius_km: 10
    min_neighbours: 3
    neighbour_median_mm: 5.0
  timezone:                    # local hour of the mean daily temperature maximum
    expected_local_hour_of_max: {min: 11, max: 17}
  isd_bad_quality_codes: ["2", "3", "6", "7"]

# Forecast values left out because the archive itself is wrong there, not the model.
# Each entry is explained in docs/failure_modes.md and the protocol change log.
exclusions:
  - {source: gfs_global, variable: rain_hourly, lead_kind: day, leads: [5, 7],
     reason: "archived GFS rain beyond 120 hours averages a third of its day-1 amount with the same share of wet hours"}
  - {source: gfs_global, variable: rain_hourly, lead_kind: hour, leads: [121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132, 133, 134, 135, 136, 137, 138, 139, 140, 141, 142, 143, 144, 145, 146, 147, 148, 149, 150, 151, 152, 153, 154, 155, 156, 157, 158, 159, 160, 161, 162, 163, 164, 165, 166, 167, 168],
     reason: "same fault, seen in whole runs beyond hour 120"}

# Added 2026-11-14, after the main scoring, from published conventions (protocol change log).
# Skill: each model's change in mean absolute error against climatology, as a percentage of
# climatology's error on the same cases, at every lead day. Extremes: the relative quantile
# error of 6-hour rain totals, against each gauge and against the gauges averaged over the
# model's own grid cell (only cell-times with at least cell_mean_min_gauges gauges).
summary_scores:
  skill_variables: [rain_hourly, rain_6h, temperature_2m, wind_speed_10m]
  extremes_quantiles: [0.99, 0.999]
  cell_mean_min_gauges: 5
  # Decision value (added 2026-11-14): protect when the forecast reaches the heavy-rain
  # threshold of protocol section 4, in the hour and in the 6-hour total. The value is the
  # share of a perfect forecast's saving over the best fixed choice, for each ratio of the
  # cost of protecting to the loss it avoids.
  decision_threshold_mm: 10.0
  decision_windows: [rain_hourly, rain_6h]
  cost_loss_ratios: [0.005, 0.01, 0.02, 0.03, 0.05, 0.1, 0.2, 0.3, 0.5]

# Page counts on the hosted site only (GitHub Pages). GoatCounter: no cookies, no personal data.
# Empty code = no counter. The counter is added to docs/, never to the local dashboard.
analytics:
  goatcounter_code: "tropics-scorecard"
