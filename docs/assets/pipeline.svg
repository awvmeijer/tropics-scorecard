<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-label="How Tropics Scorecard works: observations and forecasts are matched, scored against baselines, and published with intervals"><style>.node{opacity:0;animation:in .6s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.wire{animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}@media (prefers-reduced-motion: reduce){.node{animation:none;opacity:1}.wire{animation:none}}</style><rect width="980" height="430" fill="#ffffff"/><path d="M250,95 C300,95 300,150 350,150" fill="none" stroke="#e4e4e4" stroke-width="2"/><path class="wire" d="M250,95 C300,95 300,150 350,150" fill="none" stroke="#262626" stroke-width="2" stroke-dasharray="6 8"/><circle r="4" fill="#262626"><animateMotion dur="3.2s" begin="0.00s" repeatCount="indefinite" path="M250,95 C300,95 300,150 350,150"/></circle><circle r="4" fill="#262626"><animateMotion dur="3.2s" begin="1.07s" repeatCount="indefinite" path="M250,95 C300,95 300,150 350,150"/></circle><circle r="4" fill="#262626"><animateMotion dur="3.2s" begin="2.13s" repeatCount="indefinite" path="M250,95 C300,95 300,150 350,150"/></circle><path d="M250,335 C300,335 300,280 350,280" fill="none" stroke="#e4e4e4" stroke-width="2"/><path class="wire" d="M250,335 C300,335 300,280 350,280" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 8"/><circle r="4" fill="#eb6834"><animateMotion dur="3.2s" begin="0.40s" repeatCount="indefinite" path="M250,335 C300,335 300,280 350,280"/></circle><circle r="4" fill="#eb6834"><animateMotion dur="3.2s" begin="1.47s" repeatCount="indefinite" path="M250,335 C300,335 300,280 350,280"/></circle><circle r="4" fill="#eb6834"><animateMotion dur="3.2s" begin="2.53s" repeatCount="indefinite" path="M250,335 C300,335 300,280 350,280"/></circle><path d="M550,150 C600,150 600,215 650,215" fill="none" stroke="#e4e4e4" stroke-width="2"/><path class="wire" d="M550,150 C600,150 600,215 650,215" fill="none" stroke="#262626" stroke-width="2" stroke-dasharray="6 8"/><circle r="4" fill="#262626"><animateMotion dur="3.2s" begin="0.80s" repeatCount="indefinite" path="M550,150 C600,150 600,215 650,215"/></circle><circle r="4" fill="#262626"><animateMotion dur="3.2s" begin="1.87s" repeatCount="indefinite" path="M550,150 C600,150 600,215 650,215"/></circle><circle r="4" fill="#262626"><animateMotion dur="3.2s" begin="2.93s" repeatCount="indefinite" path="M550,150 C600,150 600,215 650,215"/></circle><path d="M550,280 C600,280 600,215 650,215" fill="none" stroke="#e4e4e4" stroke-width="2"/><path class="wire" d="M550,280 C600,280 600,215 650,215" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 8"/><circle r="4" fill="#eb6834"><animateMotion dur="3.2s" begin="1.20s" repeatCount="indefinite" path="M550,280 C600,280 600,215 650,215"/></circle><circle r="4" fill="#eb6834"><animateMotion dur="3.2s" begin="2.27s" repeatCount="indefinite" path="M550,280 C600,280 600,215 650,215"/></circle><circle r="4" fill="#eb6834"><animateMotion dur="3.2s" begin="3.33s" repeatCount="indefinite" path="M550,280 C600,280 600,215 650,215"/></circle><path d="M450,190 L450,240" fill="none" stroke="#e4e4e4" stroke-width="2"/><path class="wire" d="M450,190 L450,240" fill="none" stroke="#b07a00" stroke-width="2" stroke-dasharray="6 8"/><circle r="4" fill="#b07a00"><animateMotion dur="3.2s" begin="0.20s" repeatCount="indefinite" path="M450,190 L450,240"/></circle><path d="M850,215 L880,215" fill="none" stroke="#e4e4e4" stroke-width="2"/><path class="wire" d="M850,215 L880,215" fill="none" stroke="#262626" stroke-width="2" stroke-dasharray="6 8"/><circle r="4" fill="#262626"><animateMotion dur="3.2s" begin="1.60s" repeatCount="indefinite" path="M850,215 L880,215"/></circle><g class="node" style="animation-delay:0.0s"><rect x="30" y="40" width="220" height="110" rx="6" fill="#ffffff" stroke="#262626" stroke-width="1.2"/><text x="44" y="64" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.1" fill="#262626">INSTRUMENTS</text><text x="44" y="86" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Rain gauges, 5 minutes</text><text x="44" y="103" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Weather stations, 1 minute</text><text x="44" y="120" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Airports and balloon soundings</text></g><g class="node" style="animation-delay:0.15s"><rect x="30" y="280" width="220" height="110" rx="6" fill="#ffffff" stroke="#262626" stroke-width="1.2"/><text x="44" y="304" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.1" fill="#262626">FORECAST ARCHIVE</text><text x="44" y="326" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">GFS and ECMWF</text><text x="44" y="343" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">1 to 7 days ahead</text><text x="44" y="360" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">One grid cell per station</text></g><g class="node" style="animation-delay:0.3s"><rect x="350" y="100" width="200" height="90" rx="6" fill="#ffffff" stroke="#262626" stroke-width="1.2"/><text x="364" y="124" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.1" fill="#262626">QUALITY CONTROL</text><text x="364" y="146" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Every flag logged</text><text x="364" y="163" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Hours kept only when complete</text></g><g class="node" style="animation-delay:0.45s"><rect x="350" y="240" width="200" height="90" rx="6" fill="#ffffff" stroke="#262626" stroke-width="1.2"/><text x="364" y="264" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.1" fill="#262626">BASELINES</text><text x="364" y="286" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Persistence, climatology</text><text x="364" y="303" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Scored exactly like a model</text></g><g class="node" style="animation-delay:0.6s"><rect x="650" y="160" width="200" height="110" rx="6" fill="#ffffff" stroke="#262626" stroke-width="1.2"/><text x="664" y="184" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.1" fill="#262626">SCORER</text><text x="664" y="206" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Same cases for everyone</text><text x="664" y="223" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Paired differences</text><text x="664" y="240" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">Block bootstrap over days</text></g><g class="node" style="animation-delay:.8s"><rect x="880" y="170" width="78" height="90" rx="6" fill="#262626"/><text x="919" y="204" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" fill="#ffffff">SCORE</text><text x="919" y="226" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff">with its</text><text x="919" y="243" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff">interval</text></g><text x="30" y="24" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.1" fill="#555555">WHAT WAS MEASURED</text><text x="30" y="264" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.1" fill="#555555">WHAT WAS FORECAST</text><text x="350" y="372" font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#555555">The rules for matching and scoring were written down before any forecast was scored.</text></svg>